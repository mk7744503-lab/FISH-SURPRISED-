<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Little Surprise 🐟🥤</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#254e70,#0b1728 70%);font-family:system-ui,sans-serif;color:white;overflow:hidden}
.card{width:min(92vw,760px);padding:28px 18px 34px;text-align:center;border:1px solid #ffffff25;border-radius:28px;background:#ffffff0d;backdrop-filter:blur(10px);box-shadow:0 25px 80px #0006}
h1{margin:0;font-size:clamp(25px,5vw,42px)}p{color:#d8e9f5;margin:8px 0 20px}
.scene{height:330px;position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(18px,8vw,70px);perspective:900px}
.object{position:relative;filter:drop-shadow(0 22px 14px #0007);animation:float 3s ease-in-out infinite}
.fish{font-size:clamp(105px,23vw,175px);transform:rotate(-12deg) rotateY(-18deg);animation:swim 4s ease-in-out infinite}
.can{width:86px;height:190px;border-radius:18px 18px 22px 22px;background:linear-gradient(90deg,#aaa 0%,#f5f5f5 18%,#c8c8c8 43%,#fff 58%,#888 100%);border:2px solid #ddd;position:relative;transform:rotate(8deg);animation:float 3.4s ease-in-out infinite}
.can:before{content:"";position:absolute;top:-8px;left:7px;right:7px;height:13px;border-radius:50%;background:linear-gradient(#eee,#777);border:1px solid #aaa}
.can:after{content:"";position:absolute;bottom:-5px;left:6px;right:6px;height:10px;border-radius:50%;background:#888}
.label{position:absolute;top:47px;left:0;width:100%;text-align:center;color:#d71920;font-weight:1000;font-size:19px;line-height:1.05;text-shadow:0 1px white}
.label small{display:block;font-size:10px;color:#333;margin-top:6px;letter-spacing:1px}
.plate{position:absolute;width:min(80%,520px);height:42px;border-radius:50%;bottom:32px;background:linear-gradient(#fff,#cbd5df);box-shadow:0 12px 22px #0008,inset 0 4px 5px #fff;z-index:-1}
.spark{position:absolute;color:#ffe99a;font-size:22px;animation:twinkle 2s infinite}
.s1{top:35px;left:15%}.s2{top:75px;right:15%;animation-delay:.8s}.s3{bottom:80px;left:18%;animation-delay:1.3s}
button{border:0;border-radius:999px;padding:12px 22px;background:#ffdf76;color:#182436;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 7px 20px #0004}
#msg{min-height:25px;margin-top:14px;color:#ffedb5;font-weight:600}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -13px}}
@keyframes swim{0%,100%{transform:rotate(-12deg) rotateY(-18deg) translateX(0)}50%{transform:rotate(-5deg) rotateY(18deg) translateX(12px)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
@media(max-width:430px){.scene{height:290px}.can{width:72px;height:165px}.label{top:40px;font-size:16px}.plate{bottom:25px}}
</style>
</head>
<body>
<main class="card">
  <h1>Surprise! 🐟🥤</h1>
  <p>Fresh fish vibes & a Diet Coke for you.</p>
  <div class="scene" aria-label="A fish and a Diet Coke can">
    <span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span>
    <div class="object fish">🐟</div>
    <div class="object can"><div class="label">Diet<br>Coke<small>ZERO SUGAR</small></div></div>
    <div class="plate"></div>
  </div>
  <button onclick="document.getElementById('msg').textContent='Enjoy, legend! 😎'">Tap for a message</button>
  <div id="msg"></div>
</main>
</body>
</html>
